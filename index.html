<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alissoooooooon :c</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#ffe9d9;--sky2:#ffc9b8;--sky3:#fff3d6;--ink:#4a2340;--ground:#2f5a3a;
  --yes:#e8546a;--yes-ink:#fff;--no-ink:#4a2340;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky1:#241538;--sky2:#6b3566;--sky3:#f0a58c;--ink:#fff4e6;--ground:#14301f;--no-ink:#fff4e6}
}
:root[data-theme="dark"]{--sky1:#241538;--sky2:#6b3566;--sky3:#f0a58c;--ink:#fff4e6;--ground:#14301f;--no-ink:#fff4e6}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#ffc9b8;background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--sky3));color:var(--ink);font-family:"Fraunces",Georgia,serif;overflow:hidden}
main{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9vh 20px 0}
h1{font-size:clamp(2rem,7vw,3.8rem);line-height:1.1;font-weight:700;margin:0 0 .6em;max-width:14ch}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:600;font-size:1.15rem;padding:.7em 1.8em;border-radius:999px;cursor:pointer;border:2px solid var(--ink);transition:transform .15s}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:var(--yes);color:var(--yes-ink);border-color:var(--yes)}
#no{background:transparent;color:var(--no-ink)}
#msg{margin:1.2em 0 0;min-height:1.6em;font-size:1.1rem;font-weight:500}
#count{margin:.2em 0 0;font-size:.95rem;opacity:.8}
#garden{position:fixed;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom,0px));height:62vh;z-index:1;pointer-events:none}
#ground{position:fixed;left:-5%;right:-5%;bottom:0;height:calc(10vh + env(safe-area-inset-bottom,0px));background:var(--ground);border-radius:50% 50% 0 0/40% 40% 0 0;z-index:2}
.f{position:absolute;bottom:0;transform-origin:50% 100%;transition:transform 2.4s ease}
.f svg{display:block;height:100%;width:100%;overflow:visible;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.f.wilt{transform:rotate(var(--tilt))}
.f.wilt svg{animation:none}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.stem{fill:none;stroke:#3f8a4f;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.3s ease-out forwards;transition:stroke 2s}
@keyframes grow{to{stroke-dashoffset:0}}
.leaf{fill:#4fa05d;transform:scale(0);animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards;transition:fill 2s}
.l1{transform-origin:47px 215px;animation-delay:.7s}
.l2{transform-origin:48px 190px;animation-delay:.95s}
@keyframes pop{to{transform:scale(1)}}
.head{transform-origin:50px 70px;transition:transform 2.2s ease}
.wilt .head{transform:rotate(75deg) translateY(8px)}
.bloom{transform-origin:50px 70px;transform:scale(0);animation:pop 1.3s 1.1s cubic-bezier(.2,1.5,.4,1) forwards}
.pw{transition:transform 2.8s ease-in,opacity 2.8s ease-in}
.petal{transition:fill 2s}
.wilt .petal{fill:#9a8670}
.wilt .leaf{fill:#8a8a48}
.wilt .stem{stroke:#7d8a4a}
.wilt .pw:nth-child(3n){transform:translate(var(--fx),210px) rotate(70deg);opacity:0}
.wilt .pw:nth-child(5n+1){transform:translate(calc(var(--fx) * -1),180px) rotate(-60deg);opacity:0}
.core{transition:fill 2s}
.wilt .core{fill:#6b5a44}
@media (prefers-reduced-motion:reduce){
  .f svg{animation:none}.stem{animation-duration:.01s}.leaf,.bloom{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<main>
  <h1>Alisson perdón :c</h1>
  <div class="btns">
    <button id="yes" type="button">Sí</button>
    <button id="no" type="button">No</button>
  </div>
  <p id="msg" aria-live="polite"></p>
  <p id="count">Cada que des click en el botón "Sí" o "No" habrá una reacción en el jardín :3</p>
</main>
<div id="garden"></div>
<div id="ground"></div>
<script>
(function(){
  var garden=document.getElementById('garden'),msg=document.getElementById('msg'),count=document.getElementById('count');
  var colors=['#ff7a8a','#ffd166','#c3a6ff','#fff3e0','#ff9f7a','#7fc8ff'];
  var yesMsgs=['Alisson :c','Se que fue algo muy estúpido','Soy estúpido','Pero no quiero que dejemos de ser amigos','Te aprecio mucho','Y no quiero perder tu amistad','Por favor perdóname :c', 'Soy muy estúpido', 'Fui bien tonto', 'Fui un idiota', 'Alissooooooon :c', 'Perdooooooon :c'];
  var noMsgs=['Una flor se marchita…','Se les caen los pétalos','El jardín se queda callado'];
  var flowers=[],yi=0,ni=0;

  function rnd(a,b){return a+Math.random()*(b-a)}

  function build(){
    var c=colors[Math.floor(Math.random()*colors.length)];
    var core=c==='#ffd166'?'#a85a2a':'#ffd166';
    var n=6+Math.floor(Math.random()*4),p='';
    for(var i=0;i<n;i++){
      p+='<g class="pw" style="--fx:'+Math.round(rnd(10,45))+'px"><ellipse class="petal" cx="50" cy="52" rx="8" ry="19" fill="'+c+'" transform="rotate('+(360/n*i)+' 50 70)"/></g>';
    }
    var h=Math.min(rnd(130,270),window.innerHeight*0.4);
    var el=document.createElement('div');
    el.className='f';
    el.style.cssText='left:'+rnd(1,93)+'%;height:'+h+'px;width:'+(h/3)+'px;z-index:'+Math.floor(rnd(1,9))+';--tilt:'+(Math.random()<.5?-1:1)*rnd(10,22)+'deg';
    el.innerHTML='<svg viewBox="0 0 100 300" aria-hidden="true">'+
      '<path class="stem" pathLength="1" d="M50 300 C50 220 44 150 50 70"/>'+
      '<path class="leaf l1" d="M47 215 C20 205 15 180 22 170 C40 175 48 195 47 215Z"/>'+
      '<path class="leaf l2" d="M48 190 C76 180 82 155 76 145 C58 150 49 170 48 190Z"/>'+
      '<g class="head"><g class="bloom">'+p+'<circle class="core" cx="50" cy="70" r="9" fill="'+core+'"/></g></g></svg>';
    return el;
  }

  function update(){
    var alive=flowers.filter(function(f){return !f.classList.contains('wilt')}).length;
    if(!flowers.length) count.textContent='Tu jardín está vacío';
    else if(!alive) count.textContent='Todas las flores se marchitaron';
    else count.textContent=alive+(alive===1?' flor viva':' flores vivas');
  }

  document.getElementById('yes').addEventListener('click',function(){
    var wilted=flowers.filter(function(f){return f.classList.contains('wilt')});
    if(wilted.length) wilted[Math.floor(Math.random()*wilted.length)].classList.remove('wilt');
    var f=build();
    garden.appendChild(f);
    flowers.push(f);
    if(flowers.length>45){var old=flowers.shift();old.remove()}
    msg.textContent=yesMsgs[yi++%yesMsgs.length];
    update();
  });

  document.getElementById('no').addEventListener('click',function(){
    var alive=flowers.filter(function(f){return !f.classList.contains('wilt')});
    if(!flowers.length){msg.textContent='Aún no hay flores. ¿Y si probamos con un sí?';return}
    if(!alive.length){msg.textContent='Ya no queda ninguna viva. Un sí las puede revivir.';return}
    alive[Math.floor(Math.random()*alive.length)].classList.add('wilt');
    msg.textContent=noMsgs[ni++%noMsgs.length];
    update();
  });
})();
</script>
</body>
</html>
